# API Test Configuration Properties

# Base Configuration
base.uri=https://jsonplaceholder.typicode.com
base.path=/
content.type=application/json

# Performance Thresholds
performance.threshold.ms=200
performance.threshold.acceptable.ms=500

# Test Data
test.user.id=1
test.post.id=1
test.posts.limit=5

# Retry Configuration
retry.count=3
retry.timeout=5000

# Logging Configuration
logging.enabled=true
logging.level=INFO
